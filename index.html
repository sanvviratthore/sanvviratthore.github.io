<style>
/* ============================================================
   DOLLHOUSE OS  ·  tokens
   ============================================================ */
:root{
  --plum:#3B1E35;
  --plum-soft:#6B4A63;
  --bubblegum:#FF6FB5;
  --deep-pink:#E03D86;
  --periwinkle:#8E9BF5;
  --mint:#7FE3C4;
  --butter:#FFE082;
  --tangerine:#FF9E4A;
  --milk:#F6F1FA;
  --plastic:#EDE3F4;
  --wood:#C08A5A;
  --wood-dark:#8C5A3C;

  --chrome: "Silkscreen", "Courier New", monospace;
  --body: "Karla", system-ui, sans-serif;

  --tb-h: 54px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--body);
  color:var(--plum);
  background:#2A1526;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--periwinkle);outline-offset:2px}

/* ============================================================
   BOOT
   ============================================================ */
#boot{
  position:fixed;inset:0;z-index:9000;
  background:
    radial-gradient(120% 90% at 50% 40%, #4A2440 0%, #241120 70%);
  display:flex;align-items:center;justify-content:center;
  padding:24px;
}
#boot.gone{display:none}
.boot-card{width:min(560px,100%);}
.boot-brand{
  font-family:var(--chrome);font-size:clamp(22px,5vw,34px);
  color:var(--bubblegum);letter-spacing:.02em;line-height:1.3;
  text-shadow:0 0 22px rgba(255,111,181,.45);
}
.boot-sub{
  font-family:var(--chrome);font-size:11px;color:#B892AE;
  margin-top:10px;
}
.boot-log{
  margin-top:26px;font-family:var(--chrome);font-size:12px;
  color:#E8D5E2;line-height:2;min-height:150px;
}
.boot-log b{color:var(--mint);font-weight:400}
.boot-bar{
  height:14px;border:2px solid #7B5570;background:#2A1526;
  margin-top:8px;padding:2px;
}
.boot-bar i{display:block;height:100%;width:0%;background:var(--bubblegum);transition:width .3s linear}
.doorbell{
  margin-top:26px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  opacity:0;pointer-events:none;transition:opacity .4s;
}
.doorbell.on{opacity:1;pointer-events:auto}
.doorbell button{
  font-family:var(--chrome);font-size:13px;
  background:var(--bubblegum);color:#fff;
  padding:14px 22px;border-radius:2px;
  box-shadow:0 4px 0 var(--deep-pink);
}
.doorbell button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--deep-pink)}
.doorbell span{font-family:var(--chrome);font-size:10px;color:#B892AE}

/* ============================================================
   DESKTOP
   ============================================================ */
#os{position:fixed;inset:0;display:flex;flex-direction:column;opacity:0;transition:opacity .5s}
#os.on{opacity:1}

#desk{
  position:relative;flex:1;overflow:hidden;
  background:
    radial-gradient(90% 70% at 50% 0%, #F3D9E9 0%, #E3D2F0 55%, #D6C8EC 100%);
}
#deskSvgWrap{position:absolute;inset:0;display:grid;place-items:center;padding:14px 14px 4px}
#deskSvg{width:100%;height:100%;max-width:1180px}

.room-hit{cursor:pointer}
.room-hit rect.glass{fill:#fff;opacity:0;transition:opacity .18s}
.room-hit:hover rect.glass,.room-hit:focus-visible rect.glass{opacity:.22}
.room-hit .tag text{font-family:var(--chrome);font-size:13px;fill:#fff}
.room-hit .tag rect{fill:var(--plum);transition:fill .18s}
.room-hit:hover .tag rect,.room-hit:focus-visible .tag rect{fill:var(--deep-pink)}

/* ============================================================
   WINDOWS
   ============================================================ */
.win{
  position:absolute;z-index:10;
  width:min(560px,92vw);
  background:var(--milk);
  border:2px solid var(--plum);
  border-radius:4px;
  box-shadow:8px 8px 0 rgba(59,30,53,.22);
  display:flex;flex-direction:column;
  max-height:calc(100% - 24px);
  animation:pop .18s ease-out;
}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.win.max{left:8px!important;top:8px!important;width:calc(100% - 16px)!important;height:calc(100% - 16px)!important;max-height:none}
.win.min{display:none}

.win-bar{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;
  background:var(--room, var(--bubblegum));
  border-bottom:2px solid var(--plum);
  cursor:grab;touch-action:none;user-select:none;
}
.win-bar:active{cursor:grabbing}
.win-bar h2{
  font-family:var(--chrome);font-size:12px;font-weight:400;
  color:var(--plum);flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.win-btns{display:flex;gap:5px}
.win-btns button{
  width:20px;height:20px;border:2px solid var(--plum);
  background:var(--milk);border-radius:2px;
  font-family:var(--chrome);font-size:9px;line-height:1;
  display:grid;place-items:center;
}
.win-btns button:hover{background:#fff}
.win-btns .x:hover{background:var(--deep-pink);color:#fff}

.win-body{padding:22px;overflow-y:auto;flex:1}
.win-body::-webkit-scrollbar{width:12px}
.win-body::-webkit-scrollbar-track{background:var(--plastic)}
.win-body::-webkit-scrollbar-thumb{background:var(--bubblegum);border:2px solid var(--plum)}

/* ---- window content ---- */
.w-head{margin-bottom:18px}
.w-head h3{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.w-head p{font-size:14px;color:var(--plum-soft);margin-top:4px}

.entry{
  padding:16px 0;
  border-top:1px dashed #C9B4C4;
}
.entry:first-of-type{border-top:none;padding-top:4px}
.entry h4{font-size:17px;font-weight:700;line-height:1.3}
.entry .meta{font-family:var(--chrome);font-size:10px;color:var(--plum-soft);margin-top:5px}
.entry p{font-size:14.5px;line-height:1.6;margin-top:8px;max-width:62ch}
.entry a.go{
  display:inline-block;margin-top:10px;
  font-family:var(--chrome);font-size:10px;
  color:var(--plum);text-decoration:none;
  border-bottom:2px solid var(--bubblegum);padding-bottom:2px;
}
.entry a.go:hover{background:var(--butter)}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{
  font-family:var(--chrome);font-size:9px;
  padding:5px 8px;background:var(--plastic);
  border:1px solid #C9B4C4;border-radius:2px;
}

.shelf{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.jar{
  border:2px solid var(--plum);border-radius:3px;
  padding:14px;background:#fff;
}
.jar .lvl{height:7px;background:var(--plastic);margin-top:9px;border:1px solid var(--plum)}
.jar .lvl i{display:block;height:100%;background:var(--room,var(--bubblegum))}
.jar strong{font-size:15px;display:block}
.jar span{font-family:var(--chrome);font-size:9px;color:var(--plum-soft)}

.note{
  background:var(--butter);border:2px solid var(--plum);
  padding:14px 16px;font-size:14px;line-height:1.55;margin-top:16px;
}
.note b{font-family:var(--chrome);font-size:10px;display:block;margin-bottom:6px}

.dl{
  display:inline-flex;align-items:center;gap:10px;
  font-family:var(--chrome);font-size:12px;
  background:var(--plum);color:var(--milk);
  padding:14px 20px;border-radius:2px;text-decoration:none;margin-top:6px;
}
.dl:hover{background:var(--deep-pink)}

.cards{display:grid;gap:10px}
.card-link{
  display:flex;align-items:center;gap:12px;
  border:2px solid var(--plum);border-radius:3px;
  padding:13px 15px;background:#fff;text-decoration:none;color:inherit;
}
.card-link:hover{background:var(--butter)}
.card-link .k{font-family:var(--chrome);font-size:10px;color:var(--plum-soft);display:block}
.card-link .v{font-size:15px;font-weight:700}

/* terminal */
.term{background:#241120;color:#F0DCE9;font-family:var(--chrome);font-size:12px;line-height:1.9}
.term .win-body{padding:16px}
.term-out{white-space:pre-wrap;word-break:break-word}
.term-out .ok{color:var(--mint)}
.term-out .hi{color:var(--bubblegum)}
.term-row{display:flex;gap:8px;align-items:center;margin-top:10px}
.term-row span{color:var(--mint)}
.term-row input{
  flex:1;background:none;border:none;color:inherit;
  font-family:var(--chrome);font-size:12px;outline:none;
}

/* ============================================================
   TASKBAR
   ============================================================ */
#bar{
  height:var(--tb-h);flex:0 0 auto;
  background:var(--plum);
  display:flex;align-items:center;gap:8px;
  padding:0 10px;
  border-top:2px solid #1F0F1B;
  position:relative;z-index:500;
}
.bar-btn{
  font-family:var(--chrome);font-size:11px;color:var(--milk);
  padding:9px 12px;border-radius:2px;
  display:flex;align-items:center;gap:8px;
  white-space:nowrap;
}
#rooms-btn{background:var(--bubblegum);color:#fff}
#rooms-btn:hover{background:var(--deep-pink)}
#tasks{display:flex;gap:6px;flex:1;overflow-x:auto;scrollbar-width:none}
#tasks::-webkit-scrollbar{display:none}
#tasks .bar-btn{background:#54304C}
#tasks .bar-btn.active{background:#7B5570}
#clock{font-family:var(--chrome);font-size:11px;color:var(--milk);padding-right:4px;text-align:right}
#clock small{display:block;font-size:9px;color:#B892AE}

#launcher{
  position:absolute;bottom:calc(var(--tb-h) + 8px);left:10px;
  width:min(300px,calc(100vw - 20px));
  background:var(--milk);border:2px solid var(--plum);
  box-shadow:8px 8px 0 rgba(59,30,53,.28);
  z-index:600;display:none;
}
#launcher.on{display:block}
#launcher .lh{
  font-family:var(--chrome);font-size:10px;
  padding:10px 12px;background:var(--plum);color:var(--milk);
}
#launcher ul{list-style:none;max-height:60vh;overflow-y:auto}
#launcher li button{
  width:100%;display:flex;align-items:center;gap:12px;
  padding:11px 12px;text-align:left;font-size:14px;
  border-bottom:1px dashed #D9C7D4;
}
#launcher li button:hover{background:var(--butter)}
#launcher li button b{font-weight:700}
#launcher li button em{
  font-family:var(--chrome);font-size:9px;font-style:normal;
  color:var(--plum-soft);display:block;margin-top:2px;
}
.sw{width:22px;height:22px;border:2px solid var(--plum);border-radius:2px;flex:0 0 auto}

/* ============================================================
   DOLL
   ============================================================ */
#doll{
  position:absolute;right:14px;bottom:14px;z-index:400;
  display:flex;align-items:flex-end;gap:10px;
  pointer-events:none;
  transform:translateX(0);
  transition:transform 8s cubic-bezier(.42,0,.58,1);
  will-change:transform;
}
#dollSprite{
  width:78px;height:auto;pointer-events:auto;cursor:pointer;
  filter:drop-shadow(3px 4px 0 rgba(59,30,53,.25));
}
#dollSprite .arm-b{display:none}
#dollSprite .lid{opacity:0;animation:blink 9s steps(1) infinite}
@keyframes blink{0%,97.6%{opacity:0}98%,98.8%{opacity:1}99.2%,100%{opacity:0}}

/* wardrobe */
.rack{margin-bottom:20px}
.rack h4{font-size:15px;font-weight:700;margin-bottom:9px}
.rack .row{display:flex;flex-wrap:wrap;gap:9px}
.look{
  width:56px;padding:7px 4px;border:2px solid var(--plum);border-radius:3px;
  background:#fff;display:flex;flex-direction:column;align-items:center;gap:5px;
}
.look:hover{background:var(--butter)}
.look[aria-pressed="true"]{background:var(--plum)}
.look[aria-pressed="true"] em{color:var(--milk)}
.look .dot{width:26px;height:26px;border:2px solid var(--plum);border-radius:2px}
.look em{font-family:var(--chrome);font-size:8px;font-style:normal;line-height:1.2;text-align:center}

#bubble{
  pointer-events:auto;
  max-width:250px;background:var(--milk);
  border:2px solid var(--plum);border-radius:3px;
  padding:11px 14px;font-size:13.5px;line-height:1.5;
  box-shadow:5px 5px 0 rgba(59,30,53,.22);
  opacity:0;transform:translateY(6px);transition:opacity .22s,transform .22s;
}
#bubble.on{opacity:1;transform:translateY(0)}

@media (max-width:820px){
  #doll{right:8px;bottom:8px}
  #dollSprite{width:54px}
  #bubble{max-width:180px;font-size:12.5px}
  .win{width:calc(100vw - 16px)!important;left:8px!important;top:8px!important;height:calc(100% - 16px);max-height:none}
  .win-bar{cursor:default}
  .win-body{padding:16px}
  .w-head h3{font-size:22px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s!important;transition-duration:.001s!important}
}
</style>
</head>
<body>

<!-- ================= BOOT ================= -->
<div id="boot">
  <div class="boot-card">
    <div class="boot-brand">DOLLHOUSE OS</div>
    <div class="boot-sub">v1.0 · a portfolio you can walk around in</div>
    <div class="boot-log" id="bootLog"></div>
    <div class="boot-bar"><i id="bootBar"></i></div>
    <div class="doorbell" id="doorbell">
      <button id="enterBtn">ring the doorbell</button>
      <span>or press enter</span>
    </div>
  </div>
</div>

<!-- ================= OS ================= -->
<div id="os">
  <div id="desk">
    <div id="deskSvgWrap"><svg id="deskSvg" viewBox="0 0 1000 660" role="img" aria-label="A dollhouse floor plan. Each room opens a section of the portfolio."></svg></div>

    <div id="doll">
      <div id="bubble"></div>
      <svg id="dollSprite" viewBox="0 0 14 20" shape-rendering="crispEdges" role="button" tabindex="0" aria-label="Talk to the resident"></svg>
    </div>
  </div>

  <div id="launcher">
    <div class="lh">rooms in this house</div>
    <ul id="launchList"></ul>
  </div>

  <div id="bar">
    <button class="bar-btn" id="rooms-btn" aria-haspopup="true" aria-expanded="false">▤ rooms</button>
    <div id="tasks"></div>
    <div id="clock"></div>
  </div>
</div>

const FURN_W = 276, FURN_H = 151;

function layout(){
  return window.innerWidth < 780
    ? { cols:2, rows:4, w:300, h:186, mx:22, stairs:false }
    : { cols:3, rows:3, w:290, h:165, mx:70, stairs:true };
}

function cell(L, i){
  const c = i % L.cols, r = Math.floor(i / L.cols);
  return { x: L.mx + c*L.w, y: 120 + r*L.h };
}

/* which grid cells the rooms occupy (desktop leaves cell 4 for the stairs) */
function roomCells(L){
  return L.stairs ? [0,1,2,3,5,6,7,8] : [0,1,2,3,4,5,6,7];
}

function drawHouse(){
  const svg = document.getElementById("deskSvg");
  const L = layout();
  const W = L.w*L.cols, H = L.h*L.rows;
  const cx = L.mx + W/2;
  const viewW = W + L.mx*2;
  const viewH = 120 + H + 60;
  svg.setAttribute("viewBox", `0 0 ${viewW} ${viewH}`);

  const roofPeak = 120 - Math.min(96, W*0.16);
  const eave = Math.min(38, L.mx*0.55);
  let s = "";

  s += `<ellipse cx="${cx}" cy="${120+H+34}" rx="${W/2+eave}" ry="15" fill="#000" opacity=".10"/>`;
  s += `<path d="M${L.mx-eave} 120 L${cx} ${roofPeak} L${L.mx+W+eave} 120 Z" fill="#B5493F"/>`;
  s += `<path d="M${L.mx-eave} 120 L${cx} ${roofPeak} L${L.mx+W+eave} 120 Z" fill="none" stroke="#8E3A32" stroke-width="4"/>`;
  s += `<rect x="${L.mx+W-72}" y="${roofPeak+22}" width="28" height="${96-roofPeak/2}" rx="3" fill="#9C4238"/>`;
  s += `<rect x="${L.mx+W-78}" y="${roofPeak+16}" width="40" height="12" rx="3" fill="#8E3A32"/>`;
  s += `<rect x="${L.mx-14}" y="120" width="${W+28}" height="${H+16}" rx="6" fill="#8C5A3C"/>`;

  const cells = roomCells(L);
  ROOMS.forEach((room, idx)=>{
    const {x,y} = cell(L, cells[idx]);
    const iw = L.w-14, ih = L.h-14;
    const k = Math.min(iw/FURN_W, ih/FURN_H);
    const fx = x+7 + (iw - FURN_W*k)/2, fy = y+7 + (ih - FURN_H*k)/2;
    const tagW = room.app.length*8 + 20;

    s += `<g class="room-hit" data-room="${room.id}" tabindex="0" role="button" aria-label="Open ${room.app}">
      <rect x="${x+7}" y="${y+7}" width="${iw}" height="${ih}" fill="${WALLPAPER[room.id]}"/>
      <rect x="${x+7}" y="${y+ih-9}" width="${iw}" height="16" fill="#C08A5A"/>
      <g transform="translate(${fx} ${fy}) scale(${k})">${FURNITURE[room.id]||""}</g>
      <rect class="glass" x="${x+7}" y="${y+7}" width="${iw}" height="${ih}"/>
      <rect x="${x+7}" y="${y+7}" width="${iw}" height="${ih}" fill="none" stroke="#8C5A3C" stroke-width="7"/>
      <g class="tag" transform="translate(${x+16} ${y+ih-30})">
        <rect x="0" y="0" width="${tagW}" height="24" rx="3"/>
        <text x="10" y="16">${room.app.toLowerCase()}</text>
      </g>
    </g>`;
  });

  if(L.stairs){
    const st = cell(L, 4), iw = L.w-14, ih = L.h-14;
    s += `<g><rect x="${st.x+7}" y="${st.y+7}" width="${iw}" height="${ih}" fill="#F0E4D6"/>`;
    for(let i=0;i<7;i++){
      s += `<rect x="${st.x+22+i*34}" y="${st.y+L.h-30-i*17}" width="36" height="9" fill="#C08A5A"/>
            <rect x="${st.x+22+i*34}" y="${st.y+L.h-21-i*17}" width="9" height="17" fill="#A6754C"/>`;
    }
    s += `<rect x="${st.x+7}" y="${st.y+7}" width="${iw}" height="${ih}" fill="none" stroke="#8C5A3C" stroke-width="7"/></g>`;
  }

  svg.innerHTML = s;

  svg.querySelectorAll(".room-hit").forEach(g=>{
    g.addEventListener("click", ()=> openRoom(g.dataset.room));
    g.addEventListener("keydown", e=>{
      if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openRoom(g.dataset.room); }
    });
  });
}

let z = 20;
const open = new Map();

function openRoom(id){
  const room = ROOMS.find(r=>r.id===id);
  if(!room) return;
  say(room.line);
  if(open.has(id)){ focusWin(id); return; }
  buildWin(id, room.app, room.color, room.render(), room.name);
}

function buildWin(id, title, color, html, subtitle){
  const w = document.createElement("div");
  w.className = "win";
  w.style.setProperty("--room", color);
  w.style.zIndex = ++z;

  const n = open.size;
  const maxX = Math.max(10, window.innerWidth - 580);
  const maxY = Math.max(10, window.innerHeight - 460);
  w.style.left = Math.min(40 + n*32, maxX) + "px";
  w.style.top  = Math.min(30 + n*28, maxY) + "px";

  w.innerHTML = `
    <div class="win-bar">
      <h2>${title.toLowerCase()} ${subtitle?`— ${subtitle.toLowerCase()}`:""}</h2>
      <div class="win-btns">
        <button class="mn" title="Minimise" aria-label="Minimise">_</button>
        <button class="mx" title="Maximise" aria-label="Maximise">□</button>
        <button class="x"  title="Close"    aria-label="Close">✕</button>
      </div>
    </div>
    <div class="win-body">${html}</div>`;

  document.getElementById("desk").appendChild(w);
  open.set(id, w);

  w.addEventListener("pointerdown", ()=> focusWin(id));
  w.querySelector(".x").onclick  = e => { e.stopPropagation(); closeWin(id); };
  w.querySelector(".mn").onclick = e => { e.stopPropagation(); w.classList.add("min"); syncTasks(); };
  w.querySelector(".mx").onclick = e => { e.stopPropagation(); w.classList.toggle("max"); };
  makeDraggable(w, w.querySelector(".win-bar"));

  const term = w.querySelector("#openTerm");
  if(term) term.onclick = openTerminal;

  syncTasks();
  return w;
}

function closeWin(id){
  const w = open.get(id);
  if(!w) return;
  w.remove(); open.delete(id); syncTasks();
}
function focusWin(id){
  const w = open.get(id);
  if(!w) return;
  w.classList.remove("min");
  w.style.zIndex = ++z;
  syncTasks();
}

function makeDraggable(win, handle){
  let sx=0, sy=0, ox=0, oy=0, dragging=false;
  handle.addEventListener("pointerdown", e=>{
    if(e.target.closest(".win-btns")) return;
    if(window.innerWidth < 820) return;
    dragging = true;
    sx=e.clientX; sy=e.clientY;
    ox=win.offsetLeft; oy=win.offsetTop;
    handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener("pointermove", e=>{
    if(!dragging) return;
    const deck = document.getElementById("desk").getBoundingClientRect();
    let nx = ox + (e.clientX-sx), ny = oy + (e.clientY-sy);
    nx = Math.max(-win.offsetWidth+120, Math.min(nx, deck.width-120));
    ny = Math.max(0, Math.min(ny, deck.height-44));
    win.style.left = nx+"px"; win.style.top = ny+"px";
  });
  const stop = e => { dragging=false; try{handle.releasePointerCapture(e.pointerId)}catch(_){} };
  handle.addEventListener("pointerup", stop);
  handle.addEventListener("pointercancel", stop);
}

function syncTasks(){
  const bar = document.getElementById("tasks");
  bar.innerHTML = "";
  open.forEach((w,id)=>{
    const room = ROOMS.find(r=>r.id===id);
    const label = room ? room.app.toLowerCase() : id;
    const b = document.createElement("button");
    b.className = "bar-btn" + (w.classList.contains("min") ? "" : " active");
    b.textContent = label;
    b.onclick = ()=>{
      if(w.classList.contains("min")) focusWin(id);
      else if(w.style.zIndex == z) w.classList.add("min");
      else focusWin(id);
      syncTasks();
    };
    bar.appendChild(b);
  });
}

/* ============================================================
   5. TERMINAL
   ============================================================ */
function openTerminal(){
  if(open.has("term")){ focusWin("term"); return; }
  const w = buildWin("term","terminal","#3B1E35",
    `<div class="term-out" id="termOut"></div>
     <div class="term-row"><span>${ME.name.toLowerCase()}@dollhouse:~$</span>
     <input id="termIn" autocomplete="off" spellcheck="false" aria-label="Terminal input"/></div>`, "");
  w.classList.add("term");
  const out = w.querySelector("#termOut");
  const inp = w.querySelector("#termIn");
  print(out, `DOLLHOUSE OS terminal — type <span class="hi">help</span>\n`);
  inp.focus();
  w.addEventListener("click", ()=> inp.focus());
  inp.addEventListener("keydown", e=>{
    if(e.key!=="Enter") return;
    const cmd = inp.value.trim(); inp.value="";
    print(out, `\n<span class="ok">$</span> ${escapeHtml(cmd)}\n`);
    print(out, runCmd(cmd)+"\n");
    w.querySelector(".win-body").scrollTop = 99999;
  });
}
function print(el, html){ el.innerHTML += html; }
function escapeHtml(s){ return s.replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function runCmd(raw){
  const [cmd, ...args] = raw.toLowerCase().split(/\s+/);
  switch(cmd){
    case "": return "";
    case "help": return `rooms          list every room
open <room>    walk into a room
whoami         who lives here
projects       what's cooking
skills         what's on the vanity
contact        how to reach me
wardrobe       change my outfit
resume         grab the pdf
clear          wipe the screen
sudo           don't`;
    case "rooms": return ROOMS.map(r=>`${r.id.padEnd(10)} ${r.app}`).join("\n");
    case "open": {
      const r = ROOMS.find(r=>r.id===args[0]);
      if(!r) return `no room called "${escapeHtml(args[0]||"")}". try <span class="hi">rooms</span>`;
      openRoom(r.id); return `opening ${r.name.toLowerCase()}…`;
    }
    case "whoami": return `${ME.name} — ${ME.tagline}`;
    case "projects": return PROJECTS.map(p=>`<span class="hi">${p.title}</span> (${p.year})\n  ${p.desc}`).join("\n\n");
    case "skills": return SKILLS.map(g=>`<span class="hi">${g.group}</span>\n  ${g.items.join(", ")}`).join("\n");
    case "wardrobe": openWardrobe(); return "opening the wardrobe…";
    case "contact": return CONTACT.map(c=>`${c.label.padEnd(10)} ${c.value}`).join("\n");
    case "resume": window.open(RESUME_URL,"_blank"); return "opening resume…";
    case "clear": document.getElementById("termOut").innerHTML=""; return "";
    case "sudo": return "nice try. this is a dollhouse, not a server.";
    case "ls": return ROOMS.map(r=>r.id+"/").join("  ");
    case "date": return new Date().toString();
    default: return `command not found: ${escapeHtml(cmd)} — try <span class="hi">help</span>`;
  }
}

/* ============================================================
   6. TASKBAR + LAUNCHER + CLOCK
   ============================================================ */
function buildLauncher(){
  const ul = document.getElementById("launchList");
  ul.innerHTML = "";
  ROOMS.forEach(r=>{
    const li = document.createElement("li");
    li.innerHTML = `<button>
      <span class="sw" style="background:${r.color}"></span>
      <span><b>${r.app}</b><em>${r.name.toLowerCase()}</em></span></button>`;
    li.querySelector("button").onclick = ()=>{ openRoom(r.id); toggleLauncher(false); };
    ul.appendChild(li);
  });

  const wd = document.createElement("li");
  wd.innerHTML = `<button><span class="sw" style="background:#E03D86"></span>
    <span><b>Wardrobe</b><em>change my outfit</em></span></button>`;
  wd.querySelector("button").onclick = ()=>{ openWardrobe(); toggleLauncher(false); };
  ul.appendChild(wd);

  const li = document.createElement("li");
  li.innerHTML = `<button><span class="sw" style="background:#3B1E35"></span>
    <span><b>Terminal</b><em>for the impatient</em></span></button>`;
  li.querySelector("button").onclick = ()=>{ openTerminal(); toggleLauncher(false); };
  ul.appendChild(li);
}
function toggleLauncher(force){
  const l = document.getElementById("launcher");
  const on = force !== undefined ? force : !l.classList.contains("on");
  l.classList.toggle("on", on);
  document.getElementById("rooms-btn").setAttribute("aria-expanded", on);
}
function tickClock(){
  const d = new Date();
  document.getElementById("clock").innerHTML =
    `${d.getHours().toString().padStart(2,"0")}:${d.getMinutes().toString().padStart(2,"0")}
     <small>${d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"})}</small>`;
}

/* ============================================================
   7. BOOT SEQUENCE
   ============================================================ */
const BOOT_LINES = [
  ["counting rooms", "8 found"],
  ["dusting furniture", "ok"],
  ["hanging the dresses", "ok"],
  ["waking the resident", "ok"],
  ["putting the kettle on", "ok"],
];
function boot(){
  const log = document.getElementById("bootLog");
  const bar = document.getElementById("bootBar");
  let i = 0;
  const step = ()=>{
    if(i < BOOT_LINES.length){
      const [a,b] = BOOT_LINES[i];
      log.innerHTML += `${a}${".".repeat(Math.max(2, 26-a.length))}<b>${b}</b><br>`;
      bar.style.width = Math.round(((i+1)/BOOT_LINES.length)*100)+"%";
      i++; setTimeout(step, 340);
    } else {
      document.getElementById("doorbell").classList.add("on");
      document.getElementById("enterBtn").focus();
    }
  };
  setTimeout(step, 380);
}
function stroll(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const doll = document.getElementById("doll");
  const move = ()=>{
    const w = document.getElementById("desk").getBoundingClientRect().width;
    const max = Math.max(0, w - 360);
    doll.style.transform = `translateX(-${Math.round(Math.random()*max)}px)`;
  };
  setTimeout(move, 7000);
  setInterval(move, 17000);
}
function enterHouse(){
  document.getElementById("boot").classList.add("gone");
  document.getElementById("os").classList.add("on");
  setTimeout(()=> say(`Welcome in! I'm ${ME.name}. Click any room and I'll show you around.`, 6500), 400);
  setInterval(()=>{
    if(Math.random() < .4) say(IDLE_LINES[Math.floor(Math.random()*IDLE_LINES.length)]);
  }, 26000);
}

boot();

document.getElementById("enterBtn").onclick = enterHouse;
document.addEventListener("keydown", e=>{

document.getElementById("rooms-btn").onclick = e => { e.stopPropagation(); toggleLauncher(); };
document.addEventListener("click", e=>{

});
const sprite = document.getElementById("dollSprite");
sprite.addEventListener("click", openWardrobe);
sprite.addEventListener("keydown", e=>{
  if(e.key==="Enter"||e.key===" "){ e.preventDefault(); sprite.click(); }
});
